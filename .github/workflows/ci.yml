# Runs the Definition of Done from AGENTS.md, and nothing else.
#
# Catalogue, navigation, golden, and Patrol checks are deliberately absent:
# no widgetbook/ entry point and no integration_test/ suite exist yet, and
# AGENTS.md forbids installing that tooling preemptively. Add each check with
# the artifact it verifies.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  definition-of-done:
    name: Definition of done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      # pubspec.yaml pins nothing and pubspec.lock is not committed, so this
      # records what CI actually resolved. See deferred-work/2026-09-02-dependency-versions-unpinned.md
      - name: Report resolved versions
        run: cat pubspec.lock

      - name: Regenerate build_runner output
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Fail on stale or uncommitted generated output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo '::error::Generated output is stale or uncommitted. Run build_runner and commit the result.'
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
