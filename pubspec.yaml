name: flash_kids
description: A lightweight Flutter foundation for FlashKids.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: any
  freezed_annotation: any
  go_router: any
  json_annotation: any
  widgetbook: any
  widgetbook_annotation: any

dev_dependencies:
  build_runner: any
  flutter_lints: any
  flutter_test:
    sdk: flutter
  freezed: any
  json_serializable: any
  mocktail: any
  patrol: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/cards/
    - assets/images/decks/
    - assets/images/feedback/
    - assets/images/icons/
    - assets/images/mascots/
    - assets/images/states/
    - assets/images/subjects/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
          weight: 700
