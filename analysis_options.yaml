include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/*.freezed.dart'
    - '**/*.g.dart'
    # build_runner adds this itself on first run; committing it keeps the tree
    # clean so CI's stale-generated-output check stays meaningful.
    - build/**
    - android/**
    - web/**

linter:
  rules:
    prefer_single_quotes: true
